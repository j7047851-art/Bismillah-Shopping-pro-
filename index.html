// ১. In-App Browser (Facebook/Messenger) Detection and Fail-safe Helper
(function detectAndHandleInAppBrowser() {
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  const isFB = (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Messenger") > -1);
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);

  if (isFB) {
    if (isAndroid) {
      const currentUrl = window.location.href;
      if (!currentUrl.includes("open_external=true")) {
        const cleanUrl = currentUrl.includes("?") ? currentUrl + "&open_external=true" : currentUrl + "?open_external=true";
        const intentUrl = "intent://" + cleanUrl.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
        window.location.href = intentUrl;
      }
    } else if (isIOS) {
      window.addEventListener("DOMContentLoaded", () => {
        const notice = document.createElement("div");
        notice.style.cssText = "position:fixed;top:0;left:0;right:0;background:#fff3cd;color:#856404;padding:10px;text-align:center;z-index:99999;font-size:13px;border-bottom:1px solid #ffeeba;";
        notice.innerHTML = 'আপনি ফেসবুক ব্রাউজার ব্যবহার করছেন। ভালো অভিজ্ঞতার জন্য উপরে ডানদিকের <b>(...)</b> থ্রি ডটে ক্লিক করে <b>"Open in Safari"</b> সিলেক্ট করুন। <button onclick="this.parentElement.remove()" style="margin-left:10px;font-weight:bold;color:#000;">✕</button>';
        document.body.prepend(notice);
      });
    }
  }
})();

// ২. Safe Memory Fallback for Storage
window.memoryStorageBackup = window.memoryStorageBackup || {};

window.safeStorageGet = function(key) {
  try {
    if (window.localStorage) {
      const val = window.localStorage.getItem(key);
      if (val !== null) return val;
    }
  } catch (e) {
    console.warn("LocalStorage access blocked:", e);
  }
  return window.memoryStorageBackup[key] || null;
};

window.safeStorageSet = function(key, value) {
  try {
    if (window.localStorage) {
      window.localStorage.setItem(key, value);
    }
  } catch (e) {
    console.warn("LocalStorage write blocked:", e);
  }
  window.memoryStorageBackup[key] = String(value);
  return true;
};

// ৩. Firebase Initialization
window.firebaseEnabled = false;
window.firebaseReady = (async () => {
  try {
    const [appSdk, dbSdk] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js")
    ]);

    const firebaseConfig = {
      apiKey: "AIzaSyBX_pRUbqGszqUyaz5lOq1y4alTnadwlKU",
      authDomain: "bismillah-70c65.firebaseapp.com",
      projectId: "bismillah-70c65",
      storageBucket: "bismillah-70c65.appspot.com",
      messagingSenderId: "213565987850",
      appId: "1:213565987850:web:471571028d5330c2f193f3",
      measurementId: "G-528QTQV4JS"
    };

    const app = appSdk.getApps().length ? appSdk.getApps()[0] : appSdk.initializeApp(firebaseConfig);
    window.firebaseApp = app;
    window.db = dbSdk.getFirestore(app);
    
    Object.assign(window, {
      addDoc: dbSdk.addDoc, collection: dbSdk.collection, getDocs: dbSdk.getDocs,
      deleteDoc: dbSdk.deleteDoc, doc: dbSdk.doc, setDoc: dbSdk.setDoc,
      updateDoc: dbSdk.updateDoc, query: dbSdk.query, where: dbSdk.where,
      orderBy: dbSdk.orderBy, getDoc: dbSdk.getDoc, onSnapshot: dbSdk.onSnapshot
    });
    window.firebaseEnabled = true;
    return true;
  } catch (error) {
    console.error("Firebase Firestore initialization failed:", error);
    window.firebaseEnabled = false;
    return false;
  }
})();

// Auth Ready
window.firebaseAuthReady = (async () => {
  try {
    const firestoreReady = await window.firebaseReady;
    if (!firestoreReady) return false;
    const authSdk = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
    window.auth = authSdk.getAuth(window.firebaseApp);
    window.googleProvider = new authSdk.GoogleAuthProvider();
    Object.assign(window, {
      signInWithEmailAndPassword: authSdk.signInWithEmailAndPassword,
      createUserWithEmailAndPassword: authSdk.createUserWithEmailAndPassword,
      signOut: authSdk.signOut, onAuthStateChanged: authSdk.onAuthStateChanged,
      signInWithPopup: authSdk.signInWithPopup, signInWithRedirect: authSdk.signInWithRedirect,
      getRedirectResult: authSdk.getRedirectResult
    });
    
    // Handle redirect result for in-app browsers if popup fails
    window.getRedirectResult(window.auth).catch(() => {});
    return true;
  } catch (error) {
    console.error("Firebase Auth initialization failed:", error);
    return false;
  }
})();
</script>

<script>
const categories=["টি-শার্ট","প্যান্ট","গেঞ্জি","ব্লুটুথ","সেলফিস্টিক","ইলেকট্রনিক্স","লেডিস ফ্যাশন","১পিস ২পিস","৩পিস","লেহেঙ্গা","শাড়ি","বোরকা","ব্রা","হোম ডেকোর","ঘড়ি","অন্যান্য"];
let products=[];let filteredProductsCache=[];let activeCategory="all";let activeSearch="";let productUnsubscribe=null;let visibleProductLimit=24;const PRODUCT_PAGE_SIZE=24;let cart=[];
try{cart=JSON.parse(window.safeStorageGet("pro_cart_v2")||"[]");if(!Array.isArray(cart))cart=[];}catch(e){cart=[];}
const FIXED_BKASH="01827899235";const $=id=>document.getElementById(id);
const ADMIN_EMAIL = "j7047851@gmail.com";

function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function cleanText(v){return String(v||"").trim().toLowerCase().replace(/\s+/g," ")}
function formatPrice(v){const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat("bn-BD").format(n):"0"}
function safeImageUrl(url){const v=String(url||"").trim();return /^https?:\/\//i.test(v)||/^data:image\//i.test(v)?v:"https://picsum.photos/500/500"}

function saveCart(){
  window.safeStorageSet("pro_cart_v2",JSON.stringify(cart));
  updateCartCount();
}
async function copyBkash(){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(FIXED_BKASH);
      alert("নাম্বার কপি হয়েছে");
    }else{
      alert("বিকাশ নাম্বার: " + FIXED_BKASH);
    }
  }catch(error){
    alert("বিকাশ নাম্বার: " + FIXED_BKASH);
  }
}

// Robust Cache Management
async function readProductCache(){
  try{
    const parsed=JSON.parse(window.safeStorageGet("bismillah_products_cache")||"[]");
    return Array.isArray(parsed)?parsed:[];
  }catch(error){
    return [];
  }
}

async function writeProductCache(items){
  window.safeStorageSet("bismillah_products_cache",JSON.stringify(items));
}

let productLoadInProgress = false;

async function loadProducts() {
  const productBox = $("products");
  if(!productBox) return;
  if(productLoadInProgress) return;
  productLoadInProgress = true;

  try {
    const cachedProducts = await readProductCache();
    if (cachedProducts.length && !products.length) {
      products = cachedProducts;
      applyProductFilters();
    } else if (!products.length) {
      productBox.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">প্রোডাক্ট লোড হচ্ছে...</p>';
    }
  } catch(e) {}

  try {
    const ready = await window.firebaseReady;
    if (!ready || !window.firebaseEnabled || !window.db || !window.onSnapshot) {
      if (!products.length) {
        productBox.innerHTML = '<p class="col-span-full text-center text-red-600 py-8">Firebase সংযোগ হয়নি।</p>';
      }
      productLoadInProgress = false;
      return;
    }

    if (typeof productUnsubscribe === "function") {
      try { productUnsubscribe(); } catch(e){}
      productUnsubscribe = null;
    }

    // Realtime Firestore Snapshot Listener optimized for 100,000+ items
    productUnsubscribe = window.onSnapshot(
      window.collection(window.db, "products"),
      (snapshot) => {
        try {
          const nextProducts = snapshot.docs.map((docSnap) => {
            const data = docSnap.data() || {};
            return {
              ...data,
              id: docSnap.id,
              name: String(data.name || data.title || "").trim(),
              cat: String(data.cat || data.category || "অন্যান্য").trim(),
              desc: String(data.desc || data.description || "").trim(),
              img: String(data.img || data.image || data.imageUrl || "").trim(),
              price: Number(data.price) || 0,
              stock: Number(data.stock) || 0
            };
          });

          products = nextProducts;
          visibleProductLimit = PRODUCT_PAGE_SIZE;
          applyProductFilters();
          writeProductCache(nextProducts);
        } catch(renderErr) {
          console.error("Error processing snapshot data:", renderErr);
        }
      },
      (error) => {
        console.error("Firestore error:", error);
        if (!products.length) {
          productBox.innerHTML = `<p class="col-span-full text-center text-red-600 py-8">প্রোডাক্ট লোড হয়নি।</p>`;
        }
      }
    );
  } catch (error) {
    console.error("Product loading failed:", error);
  } finally {
    productLoadInProgress = false;
  }
}

function renderCat(){
  const d=$("catBtns");
  d.innerHTML="";
  categories.forEach(c=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="bg-white border p-2 rounded text-sm font-bold hover:bg-green-700 hover:text-white";
    b.textContent=c;
    b.onclick=()=>filterCat(c);
    d.appendChild(b);
  });
  const a=document.createElement("button");
  a.type="button";
  a.className="bg-green-700 text-white p-2 rounded font-bold col-span-2 md:col-span-4 lg:col-span-8";
  a.textContent="সব প্রোডাক্ট দেখুন";
  a.onclick=()=>filterCat("all");
  d.appendChild(a);
}

function render(list){
  const box=$("products");
  box.innerHTML="";
  $("productCount").innerText=`${list.length}টি প্রোডাক্ট`;
  const visibleList = list.slice(0, visibleProductLimit);
  const moreButton = $("loadMoreProducts");
  if (moreButton) moreButton.classList.toggle("hidden", list.length <= visibleList.length);
  
  if(!list.length){
    box.innerHTML='<p class="col-span-full text-center text-gray-500 py-8">এই মুহূর্তে কোনো প্রোডাক্ট পাওয়া যায়নি।</p>';
    return;
  }
  
  // DocumentFragment for high performance rendering (supports 100,000+ items smoothly)
  const fragment = document.createDocumentFragment();

  visibleList.forEach(p=>{
    const card=document.createElement("div");
    const stock=Math.max(0,Number(p.stock)||0);
    card.className="bg-white p-2 rounded shadow border flex flex-col justify-between";
    
    const imgBtn = document.createElement("button");
    imgBtn.type = "button";
    imgBtn.className = "w-full text-left";
    imgBtn.onclick = () => openProductModal(p.id);
    const imgEl = document.createElement("img");
    imgEl.src = safeImageUrl(p.img);
    imgEl.loading = "lazy";
    imgEl.className = "h-32 w-full object-cover rounded";
    imgBtn.appendChild(imgEl);
    
    const titleBtn = document.createElement("button");
    titleBtn.type = "button";
    titleBtn.className = "text-sm font-bold block mt-1 text-left w-full truncate";
    titleBtn.textContent = p.name || "নাম নেই";
    titleBtn.onclick = () => openProductModal(p.id);

    const catP = document.createElement("p");
    catP.className = "text-xs text-gray-500";
    catP.textContent = p.cat || "অন্যান্য";

    const priceP = document.createElement("p");
    priceP.className = "font-bold text-green-700 mt-1";
    priceP.textContent = formatPrice(p.price) + "৳";

    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "bg-green-700 disabled:bg-gray-400 text-white w-full py-1.5 rounded text-xs font-bold mt-2";
    addBtn.textContent = stock <= 0 ? "স্টক আউট" : "Add to Cart";
    addBtn.disabled = stock <= 0;
    addBtn.onclick = () => addToCart(p.id);

    const contentDiv = document.createElement("div");
    contentDiv.appendChild(imgBtn);
    contentDiv.appendChild(titleBtn);
    contentDiv.appendChild(catP);
    contentDiv.appendChild(priceP);

    card.appendChild(contentDiv);
    card.appendChild(addBtn);
    fragment.appendChild(card);
  });
  box.appendChild(fragment);
}

function showMoreProducts(){visibleProductLimit += PRODUCT_PAGE_SIZE;render(filteredProductsCache);}
function filterCat(c){visibleProductLimit=PRODUCT_PAGE_SIZE;activeCategory=c;$("catName").innerText=c==="all"?"All":c;applyProductFilters()}

function applyProductFilters(){
  const s=cleanText(activeSearch);
  filteredProductsCache=products.filter(p=>{
    const catOK=activeCategory==="all"||cleanText(p.cat||"অন্যান্য")==cleanText(activeCategory);
    const hay=cleanText([p.name,p.cat,p.desc].filter(Boolean).join(" "));
    return catOK&&(!s||hay.includes(s));
  });
  render(filteredProductsCache);
}

function findProduct(id){return products.find(p=>String(p.id)===String(id))}

function openProductModal(id){
  const p=findProduct(id);
  if(!p)return alert("Product পাওয়া যায়নি");
  const modalBody = $("productModalBody");
  modalBody.innerHTML = "";

  const img = document.createElement("img");
  img.src = safeImageUrl(p.img);
  img.className = "w-full h-64 object-cover rounded-lg";
  
  const title = document.createElement("h4");
  title.className = "text-xl font-bold mt-4";
  title.textContent = p.name || "নাম নেই";

  const price = document.createElement("p");
  price.className = "text-2xl font-bold text-green-700 mt-2";
  price.textContent = formatPrice(p.price) + "৳";

  const desc = document.createElement("p");
  desc.className = "text-gray-700 mt-3 whitespace-pre-line";
  desc.textContent = p.desc || "বিবরণ নেই";

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "bg-green-700 text-white w-full py-3 rounded-lg mt-5 font-bold";
  btn.textContent = "Add to Cart";
  btn.onclick = () => { addToCart(p.id); closeProductModal(); };

  modalBody.appendChild(img);
  modalBody.appendChild(title);
  modalBody.appendChild(price);
  modalBody.appendChild(desc);
  modalBody.appendChild(btn);

  $("productModal").classList.remove("hidden");
  $("productModal").classList.add("flex");
}

function closeProductModal(){$("productModal").classList.add("hidden");$("productModal").classList.remove("flex")}

function showPage(id){["home","account","profile"].forEach(v=>$(v)?.classList.add("hidden"));$(id)?.classList.remove("hidden");if(id==="profile"){loadUserOrders()}}

function addToCart(id){
  const p=findProduct(id);
  if(!p)return alert("Product পাওয়া যায়নি");
  const existing=cart.find(x=>String(x.id)===String(id));
  if(existing)existing.quantity++;
  else cart.push({id:p.id,name:p.name,price:Number(p.price)||0,img:p.img||"",quantity:1});
  saveCart();
  showCart();
}

function updateCartCount(){$("cartCount").innerText=cart.reduce((n,x)=>n+(Number(x.quantity)||0),0)}

function showCart(){
  showPage("home");
  $("cartBox").classList.remove("hidden");
  const box=$("cartItems");
  box.innerHTML="";
  let total=0;
  if(!cart.length){
    box.innerHTML='<p class="text-center text-gray-500 py-5">কার্ট খালি</p>';
    return;
  }
  cart.forEach((p,i)=>{
    total+=Number(p.price)*Number(p.quantity);
    const itemDiv = document.createElement("div");
    itemDiv.className = "flex gap-2 items-center border-b py-2 text-sm";
    itemDiv.innerHTML = `<img src="${safeImageUrl(p.img)}" class="w-12 h-12 object-cover rounded"><div class="flex-1"><div class="font-bold">${escapeHTML(p.name)}</div><div class="text-green-700 font-bold">${formatPrice(p.price*p.quantity)}৳</div></div><button onclick="removeCart(${i})" class="text-red-600 font-bold px-2">×</button>`;
    box.appendChild(itemDiv);
  });
}

function closeCart(){$("cartBox").classList.add("hidden")}
function removeCart(i){cart.splice(i,1);saveCart();showCart()}

async function checkout(){
  await window.firebaseAuthReady;
  if(!window.auth?.currentUser)return alert("অর্ডার করতে আগে লগইন করুন");
  if(!cart.length)return alert("Cart খালি");
  const trx=$("trx").value.trim(),addr=$("addr").value.trim();
  if(!trx || !addr)return alert("TrxID এবং Address দিন");
  try{
    await window.addDoc(window.collection(window.db,"orders"),{
      customerId:window.auth.currentUser.uid,
      customer:window.auth.currentUser.email,
      items:cart,
      trxId:trx,
      address:addr,
      status:"pending",
      orderTime:new Date().toISOString()
    });
    alert("অর্ডার সফলভাবে জমা হয়েছে!");
    cart=[];saveCart();closeCart();
  }catch(e){
    alert("অর্ডার দিতে সমস্যা হয়েছে");
  }
}

async function loginUser(){
  const email=$("a_email").value.trim(),pass=$("a_pass").value;
  try{
    await window.signInWithEmailAndPassword(window.auth,email,pass);
    alert("লগইন সফল!");
    showPage("profile");
  }catch(e){alert("লগইন ত্রুটি");}
}

async function registerUser(){
  const email=$("a_email").value.trim(),pass=$("a_pass").value;
  try{
    await window.createUserWithEmailAndPassword(window.auth,email,pass);
    alert("রেজিস্ট্রেশন সফল!");
    showPage("profile");
  }catch(e){alert("রেজিস্ট্রেশন ত্রুটি");}
}

async function loginWithGoogle(){
  try{
    if(/FBAN|FBAV|Messenger/i.test(navigator.userAgent)){
      await window.signInWithRedirect(window.auth, window.googleProvider);
    } else {
      await window.signInWithPopup(window.auth, window.googleProvider);
    }
    alert("গুগল লগইন সফল!");
    showPage("profile");
  }catch(e){alert("গুগল লগইন ত্রুটি: " + (e.message || e));}
}

async function logout(){
  await window.signOut(window.auth);
  showPage("account");
}

function openAdminLogin(){$("adminLogin").classList.remove("hidden")}
function closeAdminLogin(){$("adminLogin").classList.add("hidden")}

async function loginAdmin(){
  const email=$("adminEmail").value.trim(),pass=$("adminPass").value;
  if(email !== ADMIN_EMAIL)return alert("অনুমোদিত নয়");
  try{
    await window.signInWithEmailAndPassword(window.auth,email,pass);
    closeAdminLogin();
    $("adminPanel").classList.remove("hidden");
    loadAdmin();
  }catch(e){alert("অ্যাডমিন লগইন ব্যর্থ");}
}

function closeAdminPanel(){$("adminPanel").classList.add("hidden")}

function switchAdminTab(tab){
  if(tab==='orders'){
    $("adminOrdersSection").classList.remove("hidden");
    $("adminProductsSection").classList.add("hidden");
    $("btnTabOrders").className="bg-blue-600 text-white flex-1 py-2 px-3 rounded font-bold text-sm";
    $("btnTabProducts").className="bg-gray-700 text-white flex-1 py-2 px-3 rounded font-bold text-sm";
    loadAdminOrders();
  }else{
    $("adminOrdersSection").classList.add("hidden");
    $("adminProductsSection").classList.remove("hidden");
    $("btnTabOrders").className="bg-gray-700 text-white flex-1 py-2 px-3 rounded font-bold text-sm";
    $("btnTabProducts").className="bg-blue-600 text-white flex-1 py-2 px-3 rounded font-bold text-sm";
    loadAdmin();
  }
}

async function loadAdmin(){
  const list=$("adminList");
  list.innerHTML="";
  products.forEach(p=>{
    const row=document.createElement("div");
    row.className="flex justify-between border-b py-2 items-center";
    row.innerHTML=`<span>${escapeHTML(p.name)} - ${formatPrice(p.price)}৳</span><button onclick="delProd('${p.id}')" class="text-red-600 font-bold">Delete</button>`;
    list.appendChild(row);
  });
}

async function loadAdminOrders(){
  const div=$("adminOrders");
  div.innerHTML="লোড হচ্ছে...";
  try{
    const q=await window.getDocs(window.collection(window.db,"orders"));
    div.innerHTML="";
    q.forEach(s=>{
      const o=s.data();
      div.innerHTML+=`<div class="border-b py-2">Customer: ${escapeHTML(o.customer)} | TrxID: ${escapeHTML(o.trxId)} | Status: ${o.status}</div>`;
    });
  }catch(e){div.innerText="অর্ডার লোড হয়নি";}
}

async function addProduct(){
  const name=$("ad_name").value.trim(),price=Number($("ad_price").value),stock=Number($("ad_stock").value),cat=$("ad_cat").value.trim(),desc=$("ad_desc").value.trim(),img=$("ad_img").value.trim();
  if(!name)return alert("নাম দিন");
  try{
    await window.addDoc(window.collection(window.db,"products"),{cat,name,price,stock,desc,img:img||"https://picsum.photos/500/500"});
    alert("প্রোডাক্ট যোগ হয়েছে");
    loadAdmin();
  }catch(e){alert("সেভ হয়নি");}
}

async function delProd(id){
  if(!confirm("মুছে ফেলতে চান?"))return;
  await window.deleteDoc(window.doc(window.db,"products",id));
  loadAdmin();
}

async function loadUserOrders(){
  const div=$("myOrders");
  const u=window.auth?.currentUser;
  if(!u)return div.innerText="লগইন করা নেই";
  try{
    const q=await window.getDocs(window.query(window.collection(window.db,"orders"),window.where("customerId","==",u.uid)));
    div.innerHTML="";
    q.forEach(s=>{
      const o=s.data();
      div.innerHTML+=`<div>TrxID: ${escapeHTML(o.trxId)} | Status: ${o.status}</div>`;
    });
  }catch(e){div.innerText="লোড হয়নি";}
}

renderCat();
updateCartCount();

$("productSearch").addEventListener("input",e=>{
  activeSearch=e.target.value;
  visibleProductLimit=PRODUCT_PAGE_SIZE;
  applyProductFilters();
});

window.addEventListener("DOMContentLoaded",()=>{loadProducts();});
</script>
